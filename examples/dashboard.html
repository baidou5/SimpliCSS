<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimpliCSS Dashboard Example</title>
<link rel="stylesheet" href="../dist/SimpliCSS.css"><link rel="stylesheet" href="../dist/simplicss-ui.css"></head><body>
<header class="flex items-center justify-between p-4"><strong>SimpliCSS Dashboard</strong><nav aria-label="Primary"><a href="#stats">Stats</a></nav></header>
<main class="p-4"><h1>Overview</h1><section id="stats" class="grid md:grid-cols-3 gap-4" aria-label="Statistics">
<article class="sc-card"><div class="sc-card-body"><h2>Customers</h2><p>1,250</p></div></article>
<article class="sc-card"><div class="sc-card-body"><h2>Revenue</h2><p>$20,000</p></div></article>
<article class="sc-card"><div class="sc-card-body"><h2>Orders</h2><p>840</p></div></article>
</section><section aria-label="Actions" class="p-4"><button class="sc-btn sc-btn-primary" type="button">Refresh overview</button></section></main></body></html>
